name: Build HTML Package
description: Create an HTML build using love.js
inputs:
  output_folder:
    description: The folder in which the generated package file will be placed
    required: true
  product_file:
    description: The basename of the file to be generated
    required: true
  product_name:
    description: The name of the game
    required: true
runs:
  using: composite
  steps:
    - name: Install tools
      uses: ./.github/actions/install-tools
    - name: Build LOVE package
      uses: ./.github/actions/build-love
      with:
        output_folder: ${{ inputs.output_folder }}
        product_file: ${{ inputs.product_file }}
        product_name: ${{ inputs.product_name }}
    - name: Build HTML package
      shell: bash
      run: |
        curl -fsSL --retry 5 --retry-delay 15 --connect-timeout 30 --max-time 300 https://github.com/2dengine/love.js/archive/refs/heads/main.zip -o ./tools/love.js.zip || exit 1
        unzip -q ./tools/love.js.zip -d ./tools/
        sed -i "s/<title>löve.js<\/title>/<title>${{ inputs.product_name }}<\/title>/" ./tools/love.js-main/index.html
        sed -i '/<base href="\/play\/">$/d' ./tools/love.js-main/index.html
        sed -i "s/player.js/player.js?g=game.love/" ./tools/love.js-main/index.html
        sed -i '/  \/\/ DOM/i\
        // --- START GLOBAL INTERCEPTOR ---\
        var originalConsoleLog = console.log;\
        console.log = function() {\
          var text = Array.prototype.slice.call(arguments).join('"'"' '"'"');\
          var magicIdx = (text || "").indexOf("__LOVE_HTTP__");\
        \
          if (magicIdx > -1) {\
            var payload = text.substring(magicIdx + 13);\
            var parts = payload.split('"'"'|'"'"');\
            var id = parts[0], method = parts[1], url = parts[2], reqFile = parts[3], respFile = parts[4];\
            var headers = {};\
            for (var i = 5; i < parts.length; i++) {\
              var colon = parts[i].indexOf('"'"':'"'"');\
              if (colon > 0) headers[parts[i].substring(0, colon)] = parts[i].substring(colon + 1);\
            }\
            var opts = { method: method, headers: headers };\
        \
            var mod = window.Module;\
            if (!mod || !mod.FS) {\
              originalConsoleLog("[WEB_HTTP_BRIDGE] Intercepted, but Module.FS is not ready yet.");\
              return;\
            }\
        \
            if (method === "POST" && reqFile !== "") {\
              try { opts.body = mod.FS.readFile(reqFile); }\
              catch (e) { originalConsoleLog("[WEB_HTTP_BRIDGE] Error reading body from FS:", e); }\
            }\
        \
            originalConsoleLog("[WEB_HTTP_BRIDGE] Request to:", url);\
        \
            fetch(url, opts).then(function(res) {\
              var status = res.status;\
              return res.arrayBuffer().then(function(buf) {\
                var head = new TextEncoder().encode(status + "\\n");\
                var body = new Uint8Array(buf);\
                var out = new Uint8Array(head.length + body.length);\
                out.set(head, 0); out.set(body, head.length);\
                mod.FS.writeFile(respFile, out);\
                originalConsoleLog("[WEB_HTTP_BRIDGE] Success. Response saved to:", respFile);\
              });\
            }).catch(function(err) {\
              originalConsoleLog("[WEB_HTTP_BRIDGE] Fetch error:", err);\
              mod.FS.writeFile(respFile, new TextEncoder().encode("0\\n" + String(err)));\
            });\
            return; // Prevents logging the ugly string to console\
          }\
        \
          // If it is not our command, log to console normally\
          originalConsoleLog.apply(console, arguments);\
        };\
        originalConsoleLog("[WEB_HTTP_BRIDGE] Global interceptor activated successfully.");\
        // --- END GLOBAL INTERCEPTOR ---' ./tools/love.js-main/player.js
        sed -i '/<\/head>/i\
        <style>\
        body {\
          margin: 0;\
          padding: 0;\
          background: #000;\
          display: flex;\
          justify-content: center;\
          align-items: center;\
          height: 100vh;\
          overflow: hidden;\
        }\
        #canvas {\
          display: block;\
          width: auto;\
          height: auto;\
          max-width: 100vw;\
          max-height: 100vh;\
          aspect-ratio: 3 / 4;\
        }\
        </style>' ./tools/love.js-main/index.html
        convert ./resources/icon.png -define icon:auto-resize="256,128,96,64,48,32,24,16" ./tools/love.js-main/favicon.ico
        mkdir -p "${{ inputs.output_folder }}/${{ inputs.product_file }}-html"
        rsync -a --exclude='.htaccess' --exclude='*.git*' --exclude='*.md' --exclude='*.txt' \
          ./tools/love.js-main/ \
          ${{ inputs.output_folder }}/${{ inputs.product_file }}-html/
        cp -v ${{ inputs.output_folder }}/${{ inputs.product_file }}.love ${{ inputs.output_folder }}/${{ inputs.product_file }}-html/game.love
        7z a -tzip \
          "${{ inputs.output_folder }}/${{ inputs.product_file }}-html.zip" \
          "${{ inputs.output_folder }}/${{ inputs.product_file }}-html"/*
